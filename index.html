<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>PedDose</title>
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --text: #0f172a;
  --muted: #5b6575;
  --border: #d8dde5;
  --accent: #0b63c9;
  --max-bg: #fde7e7;
  --max-text: #a11414;
  --min-bg: #fff3d6;
  --min-text: #8a5a00;
  --warn-bg: #fff7e0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220;
    --surface: #131c2e;
    --surface-2: #1b263b;
    --text: #e8edf5;
    --muted: #9aa6b8;
    --border: #2a3650;
    --accent: #5aa2ff;
    --max-bg: #4a1717;
    --max-text: #ffb4b4;
    --min-bg: #43340f;
    --min-text: #ffd98a;
    --warn-bg: #2b2513;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220;
  --surface: #131c2e;
  --surface-2: #1b263b;
  --text: #e8edf5;
  --muted: #9aa6b8;
  --border: #2a3650;
  --accent: #5aa2ff;
  --max-bg: #4a1717;
  --max-text: #ffb4b4;
  --min-bg: #43340f;
  --min-text: #ffd98a;
  --warn-bg: #2b2513;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

/* Üst bar: kilo ve arama */
.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 12px) 0 10px;
  border-bottom: 1px solid var(--border);
}
.top .wrap { padding-bottom: 0; }
.kilo-satir { display: flex; gap: 8px; align-items: stretch; }
.kilo-kutu {
  flex: 1; min-width: 0; display: flex; align-items: center;
  background: var(--surface); border: 2px solid var(--accent); border-radius: 12px;
  padding: 0 14px;
}
.kilo-kutu input {
  flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--text);
  font-size: 28px; font-weight: 700; padding: 10px 0;
}
.kilo-kutu span { font-size: 20px; color: var(--muted); font-weight: 600; }
.tamam {
  border: 0; border-radius: 12px; background: var(--accent); color: #fff;
  font-size: 17px; font-weight: 700; padding: 0 18px;
}
.ara {
  width: 100%; margin-top: 8px; padding: 10px 12px; font-size: 16px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text);
}
.hata { color: var(--max-text); font-size: 14px; margin-top: 6px; min-height: 0; }

/* Broselow kartı */
.broselow {
  margin-top: 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden;
}
.renk-bant { display: flex; height: 14px; }
.renk-bant div { flex: 1; }
.broselow-ic { padding: 12px 14px; }
.broselow h2 { font-size: 17px; margin: 0 0 8px; }
.broselow-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.broselow-grid div { font-size: 14px; }
.broselow-grid b { display: block; font-size: 16px; }
.broselow-grid small { color: var(--muted); }
.broselow.bos .broselow-ic { color: var(--muted); font-size: 15px; }

/* Kategoriler */
details.kat {
  margin-top: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
}
details.kat > summary {
  list-style: none; cursor: pointer; padding: 14px 16px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 18px; font-weight: 700;
}
details.kat > summary::-webkit-details-marker { display: none; }
details.kat > summary::after { content: "▸"; color: var(--muted); transition: transform .15s; }
details.kat[open] > summary::after { transform: rotate(90deg); }
.sayac { color: var(--muted); font-weight: 500; font-size: 15px; margin-left: 6px; }
.liste { padding: 0 10px 10px; }

/* İlaç kartı */
.ilac { background: var(--surface-2); border-radius: 12px; padding: 12px; margin-top: 8px; }
.ilac-bas { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.ilac-ad { font-weight: 700; font-size: 17px; }
.yol { font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); }
.form { color: var(--muted); font-size: 13px; width: 100%; }
.doz-satir { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; align-items: baseline; }
.doz-satir .ana { font-size: 24px; font-weight: 800; }
.doz-satir .ek { font-size: 20px; font-weight: 700; }
.doz-satir .ek small, .doz-satir .ana small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.etiket { font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 6px; align-self: center; }
.etiket.MAX { background: var(--max-bg); color: var(--max-text); }
.etiket.MIN { background: var(--min-bg); color: var(--min-text); }
.detay { font-size: 14px; color: var(--muted); margin-top: 6px; }
.not { font-size: 14px; margin-top: 6px; background: var(--warn-bg); border-radius: 8px; padding: 6px 8px; }
.bekle { color: var(--muted); font-size: 15px; margin-top: 6px; }
.bos-sonuc { color: var(--muted); padding: 16px 4px; }

footer { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <form class="kilo-satir" id="kiloForm" autocomplete="off">
      <label class="kilo-kutu">
        <input id="kilo" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Kilo" aria-label="Çocuğun kilosu (kg)">
        <span>kg</span>
      </label>
      <button class="tamam" type="submit">Tamam</button>
    </form>
    <div class="hata" id="hata" role="alert"></div>
    <input class="ara" id="ara" type="search" enterkeyhint="search" placeholder="İlaç ara (ör. adrenalin)" aria-label="İlaç ara">
  </div>
</header>

<main class="wrap">
  <section class="broselow bos" id="broselow" aria-live="polite"></section>
  <div id="icerik"></div>
  <footer>
    Bu araç klinik değerlendirmenin yerini tutmaz. Her dozu uygulamadan önce kontrol edin.
  </footer>
</main>

<script src="data.js"></script>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
